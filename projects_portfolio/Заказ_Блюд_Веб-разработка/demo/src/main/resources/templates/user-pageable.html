<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пользователи</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f7fa;
        color: #333;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 25px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    h1 {
        color: #2c3e50;
        margin-top: 0;
        margin-bottom: 20px;
    }
    .nav-link {
        display: inline-block;
        margin-bottom: 15px;
        color: #007bff;
        text-decoration: none;
    }
    .nav-link:hover {
        text-decoration: underline;
    }
    .search-form {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .search-form input,
    .search-form button,
    .search-form a {
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
    }
    .search-form input {
        flex: 1;
        min-width: 150px;
    }
    .search-form button {
        background-color: #e9ecef;
        color: #495057;
    }
    .search-form button:hover {
        background-color: #dee2e6;
    }
    .search-form a {
        background-color: #dc3545;
        color: white;
        border-color: #dc3545;
        text-align: center;
    }
    .search-form a:hover {
        background-color: #c82333;
    }
    .alert-warning {
        background-color: #fff3cd;
        color: #856404;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 20px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }
    th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
    }
    thead th {
        background-color: #f8f9fa;
        font-weight: bold;
        color: #2c3e50;
    }
    th a {
        color: #007bff;
        text-decoration: none;
    }
    th a:hover {
        text-decoration: underline;
    }
    th a.text-decoration-underline {
        text-decoration: underline;
    }
    .btn-sm {
        display: inline-block;
        padding: 4px 8px;
        background-color: #17a2b8;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 0.9em;
    }
    .btn-sm:hover {
        background-color: #138496;
    }
    .pagination {
        display: flex;
        justify-content: center;
        list-style: none;
        padding: 0;
        margin: 25px 0;
    }
    .pagination li {
        margin: 0 4px;
    }
    .pagination a,
    .pagination span {
        display: block;
        padding: 6px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        text-decoration: none;
        color: #007bff;
    }
    .pagination .active a {
        background-color: #007bff;
        color: white;
        border-color: #007bff;
    }
    .pagination .disabled a {
        color: #6c757d;
        pointer-events: none;
        opacity: 0.6;
    }
    .actions {
        margin-top: 20px;
        text-align: center;
    }
    .btn {
        display: inline-block;
        padding: 8px 16px;
        margin: 0 8px;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 600;
    }
    .btn-success {
        background-color: #28a745;
        color: white;
    }
    .btn-success:hover {
        background-color: #218838;
    }
    .btn-secondary {
        background-color: #6c757d;
        color: white;
    }
    .btn-secondary:hover {
        background-color: #5a6268;
    }
    footer {
        margin-top: 30px;
        text-align: center;
        color: #7f8c8d;
        font-size: 0.9em;
    }
  </style>
</head>
<body>
<div class="container">
  <a href="/" class="nav-link"><- На главную</a>
  <h1>Список пользователей</h1>

  <form method="get" th:action="@{/users}" class="search-form">
    <input type="text"
           name="search"
           placeholder="Поиск по логину или email..."
           th:value="${search}">
    <button type="submit">Найти</button>
    <a th:if="${search != null}" href="/users">Сбросить</a>
  </form>

  <div th:if="${#lists.isEmpty(users)}" class="alert-warning">
    Пользователи не найдены
  </div>

  <div th:unless="${#lists.isEmpty(users)}">
    <table>
      <thead>
      <tr>
        <th>№</th>
        <th>
          <a th:href="@{/users(search=${search}, page=0, size=${size}, sortBy='username')}"
             th:classappend="${sortBy == 'username'} ? 'text-decoration-underline' : ''">
            Логин
          </a>
        </th>
        <th>
          <a th:href="@{/users(search=${search}, page=0, size=${size}, sortBy='email')}"
             th:classappend="${sortBy == 'email'} ? 'text-decoration-underline' : ''">
            Email
          </a>
        </th>
        <th>Роль</th>
        <th>Действия</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user, userStat : ${users}">
        <td th:text="${userStat.count}">1</td>
        <td th:text="${user.username}">username</td>
        <td th:text="${user.email}">email</td>
        <td th:text="${user.lastRole}">role</td>
        <td>
          <a th:href="@{/users/{username}(username=${user.username})}" class="btn-sm">Подробнее</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${totalPages != null and totalPages > 1}">
    <ul class="pagination">
      <li th:classappend="${currentPage == 0} ? 'disabled'">
        <a th:if="${currentPage > 0}"
           th:href="@{/users(search=${search}, page=${currentPage - 1}, size=${size}, sortBy=${sortBy})}">
          <- Назад
        </a>
        <span th:unless="${currentPage > 0}"><- Назад</span>
      </li>

      <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
          th:classappend="${i == currentPage} ? 'active' : ''">
        <a th:href="@{/users(search=${search}, page=${i}, size=${size}, sortBy=${sortBy})}"
           th:text="${i + 1}">
        </a>
      </li>

      <li th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/users(search=${search}, page=${currentPage + 1}, size=${size}, sortBy=${sortBy})}">
          Вперёд ->
        </a>
        <span th:unless="${currentPage < totalPages - 1}">Вперёд -></span>
      </li>
    </ul>
  </nav>

  <div class="actions">
    <a href="/users/add" class="btn btn-success">Добавить пользователя</a>
    <a href="/" class="btn btn-secondary"><- На главную</a>
  </div>
</div>
<footer>
  <p>&copy; 2025 Блюда</p>
</footer>
</body>
</html>

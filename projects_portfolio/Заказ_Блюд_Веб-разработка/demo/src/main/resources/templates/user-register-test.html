<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1>Регистрация нового пользователя</h1>

<form th:action="@{/test/user/register}" th:object="${user}" method="post">
  <input type="text" th:field="*{username}" placeholder="Введите имя">
  <input type="email" th:field="*{email}" placeholder="Введите почту">
  <input type="password" th:field="*{password}" placeholder="Введите пароль">
  <input type="tel" th:field="*{phone}" placeholder="Введите телефон">

  <button type="submit">Регистрация</button>
</form>

</body>
</html>

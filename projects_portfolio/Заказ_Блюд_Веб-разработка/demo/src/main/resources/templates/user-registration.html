<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f7fa;
        color: #333;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 25px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    h2 {
        color: #2c3e50;
        text-align: center;
        margin-top: 0;
        margin-bottom: 25px;
    }
    label {
        display: block;
        margin: 15px 0 5px;
        font-weight: bold;
        color: #2c3e50;
    }
    input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
    }
    input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.15);
    }
    .error {
        color: #dc3545;
        font-size: 0.9em;
        margin-top: 5px;
        display: block;
    }
    .btn {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn:hover {
        background-color: #218838;
    }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #007bff;
        text-decoration: none;
    }
    .back-link:hover {
        text-decoration: underline;
    }
    footer {
        margin-top: 30px;
        text-align: center;
        color: #7f8c8d;
        font-size: 0.9em;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Регистрация</h2>

  <form th:action="@{/users/register}" method="post" th:object="${user}">
    <label for="username">Имя пользователя</label>
    <input type="text" id="username" th:field="*{username}" placeholder="Ваш логин" />

    <label for="email">Email</label>
    <input type="email" id="email" th:field="*{email}" placeholder="Ваш email" />
    <div th:if="${emailError}" class="error" th:text="${emailError}"></div>

    <label for="password">Пароль</label>
    <input type="password" id="password" th:field="*{password}" placeholder="Пароль (не менее 6 символов)" />

    <label for="phone">Телефон</label>
    <input type="text" id="phone" th:field="*{phone}" placeholder="Например: 79123456789" />

    <button type="submit" class="btn">Зарегистрироваться</button>
  </form>

  <a th:href="@{/users/login}" class="back-link"><- Уже есть аккаунт? Войти</a>
</div>
<footer>
  <p>&copy; 2025 Блюда</p>
</footer>
</body>
</html>
